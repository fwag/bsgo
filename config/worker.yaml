# bsgo Worker Daemon Configuration
# Modeled after legacy /etc/sysconfig/obs-worker with cloud-native YAML defaults

worker:
  id: "worker-local-01"
  arch: "x86_64"
  work_dir: "/var/cache/bsgo/worker"
  state_dir: "/run/bsgo/worker"
  cache_dir: "/var/cache/bsgo/worker/cache"
  disk_dir: "/var/cache/bsgo/worker/disks"

nats:
  url: "nats://localhost:4222"

storage:
  s3_endpoint: "http://127.0.0.1:3900"
  s3_bucket: "bsgo-artifacts"
  s3_region: "garage"
  access_key: "${AWS_ACCESS_KEY_ID}"
  secret_key: "${AWS_SECRET_ACCESS_KEY}"

# Sandbox Execution Engine
sandbox:
  # Supported modes:
  #   "obs-build" : Full /usr/bin/build with standard Linux chroot isolation (fastest, native speed)
  #   "kvm"       : Sterile hardware-assisted QEMU/KVM micro-VMs
  #   "rpmbuild"  : Direct host rpmbuild (rootless, instant local developer loop)
  mode: "obs-build"
  obs_build_bin: "/usr/bin/build"

  # QEMU / KVM Micro-VM Driver (Bare-Metal Production Nodes)
  kvm:
    vm_type: "kvm"
    device: "/dev/kvm"
    memory_mb: 4096
    vcpus: 4
    user: "qemu"
    vm_args: "-sandbox on -net none"
    aio: "io_uring"
    cache_mode: "unsafe"

  # Rootless Podman Container Driver (Workstations & Desktop CI)
  podman:
    vm_type: "podman"
    image: "registry.opensuse.org/opensuse/tumbleweed:latest"
    memory: "4Gi"
    vcpus: 4
