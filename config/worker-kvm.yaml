# bsgo Worker Daemon - KVM Virtual Machine Configuration
# Modeled after Level 4 worker specifications (SUSE production fleet h01-ch3b)
# Uses QEMU/KVM hardware virtualization for sterile VM builds

worker:
  id: "worker-kvm-01"
  arch: "x86_64"
  work_dir: "/dev/shm/bsgo-worker"
  state_dir: "/run/bsgo/worker"
  cache_dir: "/var/cache/bsgo/worker/cache"
  disk_dir: "/var/cache/bsgo/worker/disks"

nats:
  url: "nats://localhost:4222"

storage:
  s3_endpoint: "http://127.0.0.1:3900"
  s3_bucket: "bsgo-artifacts"
  s3_region: "garage"
  access_key: "${AWS_ACCESS_KEY_ID}"
  secret_key: "${AWS_SECRET_ACCESS_KEY}"

# Sandbox Execution Engine
sandbox:
  mode: "kvm"
  obs_build_bin: "/usr/bin/build"

  # QEMU / KVM Driver Tuning
  kvm:
    vm_type: "kvm"
    device: "/dev/kvm"
    memory_mb: 4096
    vcpus: 4
    user: "qemu"
    vm_args: "-sandbox on -net none"
    aio: "io_uring"
    cache_mode: "unsafe"
