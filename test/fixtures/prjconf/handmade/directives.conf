# Hand-made fixture: every directive handled by read_config.
Type: spec
Repotype: rpm-md  susetags
Patterntype: ymp
Release: 3.<CI_CNT>.<B_CNT> extra
CIcntstart: 100
ReleasePrg: /usr/bin/relprg
ReleaseSuffix: suffix words here
Target: armv7hl-suse-linux
HostArch: x86_64
BuildEngine: mock
BinaryType: rpm
SingleExport: yes
Hostarch: aarch64

Preinstall: filesystem glibc bash
preinstall: rpm glibc !bash
VMinstall: kernel-default
Runscripts: aaa_base
Required: required-a required-b required-a
Support: supp-a supp-b
Keep: keep-a keep-b !*
Keep: keep-c
Prefer: foo bar baz !bar
Prefer: -blocked
Ignore: ign-a ign-b:dep1,dep2 ign-c
Ignore: !ign-c
Conflict: conf-a conf-b:conf-c conf-d,conf-e
IgnoreRebuild: ir-a ir-b
AlsoNative: an-a
OnlyNative: on-a
RepoURL: http://example.com/repo
RegistryURL: https://registry.example.com
AssetsURL: https://assets.example.com

Substitute: kernel-dev kernel-default-devel kernel-source
Substitute: ver-sub pkg-a= pkg-b pkg-a pkg-a=
Substitute: dropme x y
Substitute: !dropme
Substitute: onlykey
FileProvides: /bin/sh bash
FileProvides: /usr/bin/perl perl
FileProvides: /gone gone
FileProvides: !/gone
ExportFilter: \.src\.rpm$ aarch64 x86_64
ExportFilter: \.noarch\.rpm$
PublishFilter: .*-debuginfo.*  .*-debugsource.*
Optflags: x86_64 -O2 -g -m64
Optflags: * -O1
Optflags: aarch64 -O2 -g
Order: pkg-order-a pkg-order-b pkg-order-c !pkg-order-b
Constraint: hardware:cpu:flag sse4
Constraint: hardware:memory:size unit=G 8
ExpandFlags: module:foo module:bar notimestamps preinstallexpand keepfilerequires
BuildFlags: nodebuginfo  clean:yes
PublishFlags: create_empty_sources:1 ympdist:opensuse
DistMacro: dist .test
DistMacro: lonely
