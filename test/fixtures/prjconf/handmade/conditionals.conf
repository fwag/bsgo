# Hand-made fixture: conditionals and macros.
%define foo 1
%define bar baz
%define multi one \
  two \
  three
%global gl %{bar}-global
%define param(a:b) p=%1 q=%2 star=%* A=%{-a*} B=%{-b} n=%#

%ifarch x86_64
Prefer: arch-x86_64
%else
Prefer: arch-other
%endif
%ifnarch aarch64 i586
Prefer: not-aarch64-nor-i586
%endif
%ifarch i586 aarch64
%ifarch aarch64
Prefer: nested-aarch64
%else
Prefer: nested-i586
%endif
%elifarch x86_64
Prefer: elifarch-x86_64
%else
Prefer: arch-fallthrough
%endif
%ifos linux
Prefer: os-linux
%endif
%ifnos linux
Prefer: os-not-linux
%elifos linux
Prefer: elifos-linux
%endif
%if 0%{?foo}
Prefer: foo-set
%endif
%if 0%{?undefined_macro}
Prefer: undefined-set
%else
Prefer: undefined-unset
%endif
%if "%{bar}" == "baz" && %{foo} > 0
Prefer: expr-and
%elif 1
Prefer: expr-elif
%endif
%if 0
Prefer: never
%elif %{foo} == 1
Prefer: elif-taken
%elif 1
Prefer: elif-not-taken
%else
Prefer: else-not-taken
%endif
%if (1 + 2) * 3 == 9 || 0
Prefer: arith
%endif
%if !%{foo}
Prefer: negation
%else
Prefer: not-negation
%endif
%if 1 ? 0 : 1
Prefer: ternary-wrong
%else
Prefer: ternary-right
%endif
%if v"1.2.3" < v"1.10"
Prefer: version-compare
%endif
%if "abc" + "def" == "abcdef"
Prefer: string-plus
%endif
Prefer: %{?foo:set-%{foo}} %{!?nothere:fallback} %{?nothere:never}
Prefer: %{bar} %{gl} %multi
Prefer: %{expand:%{bar}-%{foo}} %{param -a x -b y rest1 rest2}
Prefer: %{param plain}
Prefer: %{lower:ABC} %{upper:abc} %{len:abcd} %{reverse:abc} %{rep:ab 3} %{sub:abcdef 2 4} %{gsub:aXbXc X -}
Prefer: %{basename:/a/b/c.txt} %{dirname:/a/b/c.txt} %{suffix:/a/b/c.txt}
Prefer: %{shrink:  a   b  } %{defined:foo} %{undefined:foo} %{?_target_cpu} %_target_os
Prefer: %{expr:2*3} %[1 + 2]
Prefer: x %[%{foo} + 1]
Prefer: %{echo:literal}%%literal-percent
Prefer: %{ifarch_dummy:x} unknown-%unknown
%bcond_with testsuite
%bcond_without docs
Prefer: %{with testsuite} %{with docs} %{without docs}
%if %{x86_64_dummy_zero}0
Prefer: not-reached
%endif
Prefer: @BUILD_FLAVOR@flavor @OBS_PACKAGE@
