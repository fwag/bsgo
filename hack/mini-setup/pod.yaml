apiVersion: v1
kind: Pod
metadata:
  name: bsgo-mini-setup
spec:
  containers:
    - name: nats
      image: docker.io/library/nats:2.10-alpine
      args: ["-js"]
      ports:
        - containerPort: 4222
          hostPort: 4222

    - name: postgres
      image: docker.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: "bsgo"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "bsgodb"
      ports:
        - containerPort: 5432
          hostPort: 5432

    - name: garage
      image: docker.io/dxflrs/garage:v1.0.1
      command: ["/garage", "server"]
      ports:
        - containerPort: 3900
          hostPort: 3900
        - containerPort: 3903
          hostPort: 3903
      volumeMounts:
        - name: garage-config
          mountPath: /etc/garage.toml
          readOnly: true
  volumes:
    - name: garage-config
      hostPath:
        path: hack/mini-setup/garage.toml
        type: File
